# SPDX-License-Identifier: GPL-3.0-only
# 版本发布自动化：依据 Conventional Commits 维护 release PR（chore: release vX.Y.Z）。
# PR 内自动联动四处版本号（CMakeLists project VERSION / Version.hpp kVersion /
# README 下载安装名 / CHANGELOG 版本小节，靠文件内 x-release-please 标记定位），
# 合并后自动打 tag vX.Y.Z 并建 GitHub Release。
#
# ⚠️ 下游衔接：合并 release PR 后的 tag 必须能触发 release.yml / package.yml，而
# GITHUB_TOKEN 产生的事件不会触发其它 workflow（GitHub 防递归）。因此仓库**必须**配置
# secret RELEASE_PLEASE_TOKEN：fine-grained PAT 勾 Contents: RW + Issues: RW +
# Pull requests: RW（且只授权本仓库），或 classic PAT 带 repo（+ workflow）。
# ⚠️ 本仓库 Settings→Actions→General 的 "Allow GitHub Actions to create and approve
# pull requests" 处于关闭状态，GITHUB_TOKEN 连 release PR 都建不出来——**不存在可用的
# GITHUB_TOKEN 降级路径**；缺 secret 时本 workflow 会在创建 PR 时失败（见下方检查步骤）。
#
# 操作约定（配合 doc/packaging.md 五、）：
# - 变更只写 Conventional Commits：feat → 次版本，fix → 修订版，
#   `!` + `BREAKING CHANGE:` 脚注 → 主版本；ci/docs/chore 等不进 CHANGELOG；
# - 不再手工改 CHANGELOG 版本小节、不再手工打发布 tag；
# - release PR 由 release-please 持续并入新提交，合并即发版。
name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write          # release-please 要给 release PR 打 autorelease 标签（属 Issues 权限）
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: 检查 RELEASE_PLEASE_TOKEN 已配置
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo '::warning::未配置 secret RELEASE_PLEASE_TOKEN：GITHUB_TOKEN 既建不出 release PR（本仓库未开启 Actions 创建 PR），其打的 tag 也不会触发 release.yml / package.yml（GitHub 防递归）——本次发版必然失败。请配置该 secret（Contents RW + Issues RW + Pull requests RW），见 doc/packaging.md 五、。'
          fi
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
